<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHALIL BUSINESS 🇸🇳</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --navy: #062d5c;
      --blue: #0864c7;
      --light-blue: #eaf5ff;
      --green: #079447;
      --purple: #6835d8;
      --orange: #f5a400;
      --text: #092653;
      --background: #eef8ff;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      padding-bottom: 85px;
    }

    /* =========================
       HEADER
    ========================= */

    .hero {
      position: relative;
      min-height: 285px;
      overflow: hidden;
      color: white;
      background: linear-gradient(
        135deg,
        #05284f 0%,
        #06386d 100%
      );
    }

    .hero::before {
      content: "";
      position: absolute;
      left: -5%;
      bottom: -72px;
      width: 110%;
      height: 120px;
      background: white;
      border-radius: 50% 50% 0 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -5%;
      bottom: -60px;
      width: 110%;
      height: 30px;
      background: #f5cf35;
      transform: rotate(-2deg);
    }

    .hamburger {
      position: absolute;
      top: 27px;
      left: 30px;
      z-index: 5;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }

    .bell {
      position: absolute;
      top: 27px;
      right: 30px;
      z-index: 5;
      font-size: 30px;
    }

    .bell-dot {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ed3340;
      top: -1px;
      right: -2px;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: 94%;
      max-width: 1100px;
      min-height: 260px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 25px 35px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .kb-logo {
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      border: 5px solid #f5c92e;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f5c92e;
    }

    .kb-crown {
      font-size: 29px;
      line-height: 28px;
    }

    .kb-text {
      font-size: 43px;
      font-weight: bold;
      line-height: 42px;
    }

    .brand-title {
      margin: 0;
      font-size: 42px;
      font-weight: bold;
      white-space: nowrap;
    }

    .brand-title .gold {
      color: #f5c92e;
    }

    .flag {
      font-size: 33px;
      margin-left: 7px;
    }

    .slogan {
      margin: 12px 0 0;
      font-size: 21px;
      line-height: 1.4;
      color: #e6eef8;
    }

    .profile-photo {
      width: 190px;
      height: 190px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid white;
      box-shadow: 0 0 0 4px #f4cc35;
      background: #ddd;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       CONTENU
    ========================= */

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 20px auto;
    }

    /* =========================
       STATISTIQUES
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .stat-card {
      position: relative;
      min-height: 175px;
      padding: 25px;
      overflow: hidden;
      border-radius: 24px;
      background: white;
      box-shadow: 0 6px 22px rgba(0, 60, 120, 0.09);
    }

    .sales-card {
      background: linear-gradient(
        135deg,
        #f0fff8,
        #e8fff7
      );
    }

    .profit-card {
      background: linear-gradient(
        135deg,
        #f1f8ff,
        #edf7ff
      );
    }

    .products-card {
      background: linear-gradient(
        135deg,
        #fffaf0,
        #fff4d9
      );
    }

    .customers-card {
      background: linear-gradient(
        135deg,
        #faf5ff,
        #f5eeff
      );
    }

    .stat-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
    }

    .icon-green {
      background: #0db955;
    }

    .icon-blue {
      background: #268bea;
    }

    .icon-orange {
      background: #f4a400;
    }

    .icon-purple {
      background: #7139df;
    }

    .stat-title {
      position: absolute;
      left: 125px;
      top: 28px;
      font-size: 23px;
      font-weight: bold;
    }

    .stat-value {
      position: absolute;
      left: 125px;
      top: 68px;
      font-size: 39px;
      font-weight: bold;
      color: #061f4b;
    }

    .stat-footer {
      position: absolute;
      left: 125px;
      bottom: 23px;
      font-size: 18px;
    }

    .green {
      color: #079447;
    }

    .blue {
      color: #0879df;
    }

    .orange {
      color: #e89400;
    }

    .purple {
      color: #7139df;
    }

    /* =========================
       BOUTONS PRINCIPAUX
    ========================= */

    .main-menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 22px 0;
    }

    .main-menu button {
      min-height: 78px;
      border: 0;
      border-radius: 18px;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }

    .btn-clients {
      background: linear-gradient(
        135deg,
        #0755ad,
        #0c68c9
      );
    }

    .btn-sales {
      background: linear-gradient(
        135deg,
        #008b43,
        #08a658
      );
    }

    .btn-ai {
      background: linear-gradient(
        135deg,
        #5e2bc9,
        #7439e7
      );
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      display: none;
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-top: 15px;
      box-shadow: 0 5px 20px rgba(0,50,100,0.08);
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-top: 0;
      color: var(--text);
    }

    /* =========================
       ASSISTANT
    ========================= */

    .assistant-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .assistant-heading {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .robot-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #0864c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      color: white;
    }

    .assistant-heading h2 {
      margin: 0;
      font-size: 30px;
    }

    .status {
      margin-top: 5px;
      color: #079447;
      font-size: 17px;
    }

    .assistant-name {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
    }

    .assistant-name small {
      display: block;
      margin-top: 5px;
      font-weight: normal;
    }

    #messages {
      min-height: 190px;
      max-height: 430px;
      overflow-y: auto;
      padding: 12px;
      margin: 18px 0;
      background: #f7fbff;
      border-radius: 20px;
    }

    .message {
      max-width: 88%;
      margin: 10px 0;
      padding: 16px 20px;
      border-radius: 20px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .message.assistant {
      background: #e7f2ff;
      margin-right: auto;
    }

    .message.user {
      background: #d7ebff;
      margin-left: auto;
      text-align: right;
    }

    .quick-buttons {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 3px 0 12px;
    }

    .quick-buttons button {
      white-space: nowrap;
      border: 2px solid #a5d1f5;
      color: #0870d4;
      background: white;
      border-radius: 25px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .chat-form {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #b7daf7;
      border-radius: 35px;
      padding: 7px 8px 7px 16px;
      background: white;
    }

    #messageInput {
      flex: 1;
      min-height: 48px;
      max-height: 130px;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 12px;
      font-size: 16px;
    }

    #sendButton {
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: #1685e9;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
    }

    /* =========================
       CLIENTS / VENTES
    ========================= */

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0 12px;
      border: 1px solid #ccd8e5;
      border-radius: 12px;
      font-size: 16px;
    }

    .action-button {
      border: 0;
      padding: 13px 20px;
      border-radius: 12px;
      background: #0864c7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #f3f7fb;
    }

    /* =========================
       NAVIGATION BAS
    ========================= */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      background: rgba(255,255,255,.97);
      border-top: 1px solid #dce6ef;
      box-shadow: 0 -5px 20px rgba(0,0,0,.08);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .bottom-nav button {
      border: 0;
      background: transparent;
      color: #47566d;
      font-size: 13px;
      cursor: pointer;
    }

    .bottom-nav .nav-icon {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
    }

    .bottom-nav button.active {
      color: #0879e3;
      font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .hero {
        min-height: 260px;
      }

      .hero-content {
        padding: 25px 12px;
        gap: 8px;
      }

      .brand-area {
        gap: 9px;
      }

      .kb-logo {
        width: 78px;
        height: 78px;
        border-width: 3px;
      }

      .kb-crown {
        font-size: 19px;
      }

      .kb-text {
        font-size: 27px;
      }

      .brand-title {
        font-size: 23px;
      }

      .flag {
        font-size: 21px;
      }

      .slogan {
        font-size: 13px;
        margin-top: 8px;
      }

      .profile-photo {
        width: 115px;
        height: 115px;
        border-width: 4px;
      }

      .hamburger {
        left: 15px;
        top: 22px;
        font-size: 27px;
      }

      .bell {
        right: 15px;
        top: 22px;
        font-size: 26px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stat-card {
        min-height: 145px;
        padding: 15px;
      }

      .stat-icon {
        width: 55px;
        height: 55px;
        font-size: 27px;
      }

      .stat-title {
        left: 82px;
        top: 18px;
        font-size: 16px;
      }

      .stat-value {
        left: 82px;
        top: 51px;
        font-size: 26px;
      }

      .stat-footer {
        left: 82px;
        bottom: 14px;
        font-size: 12px;
      }

      .main-menu {
        gap: 8px;
      }

      .main-menu button {
        min-height: 62px;
        font-size: 13px;
      }

      .section {
        padding: 17px;
      }

      .assistant-top {
        align-items: flex-start;
      }

      .assistant-name {
        display: none;
      }

      .assistant-heading h2 {
        font-size: 25px;
      }

      .message {
        max-width: 95%;
        font-size: 15px;
      }
    }

    @media (max-width: 430px) {

      .brand-title {
        font-size: 19px;
      }

      .slogan {
        font-size: 11px;
      }

      .kb-logo {
        width: 65px;
        height: 65px;
      }

      .kb-text {
        font-size: 22px;
      }

      .profile-photo {
        width: 95px;
        height: 95px;
      }

      .stat-title {
        font-size: 14px;
        left: 74px;
      }

      .stat-value {
        font-size: 23px;
        left: 74px;
      }

      .stat-footer {
        left: 74px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="hero">

    <div class="hamburger">☰</div>

    <div class="bell">
      ♧
      <span class="bell-dot"></span>
    </div>

    <div class="hero-content">

      <div class="brand-area">

        <div class="kb-logo">
          <div class="kb-crown">♛</div>
          <div class="kb-text">KB</div>
        </div>

        <div>
          <h1 class="brand-title">
            <span class="gold">KHALIL</span> BUSINESS
            <span class="flag">🇸🇳</span>
          </h1>

          <p class="slogan">
            Votre assistant intelligent pour gérer<br>
            votre activité
          </p>
        </div>

      </div>

      <!-- TA PHOTO PNG -->
      <div class="profile-photo">
        <img
          src="/photo.png"
          alt="Photo KHALIL BUSINESS"
        >
      </div>

    </div>

  </header>


  <!-- =========================
       CONTENU
  ========================= -->

  <main class="container">

    <!-- STATISTIQUES -->

    <div class="stats">

      <div class="stat-card sales-card">

        <div class="stat-icon icon-green">
          💰
        </div>

        <div class="stat-title">
          Chiffre d'affaires
        </div>

        <div
          class="stat-value"
          id="totalSales"
        >
          0 FCFA
        </div>

        <div class="stat-footer green">
          ↗ +0% ce mois
        </div>

      </div>


      <div class="stat-card profit-card">

        <div class="stat-icon icon-blue">
          📊
        </div>

        <div class="stat-title">
          Bénéfice
        </div>

        <div
          class="stat-value"
          id="profit"
        >
          0 FCFA
        </div>

        <div class="stat-footer blue">
          ↗ +0% ce mois
        </div>

      </div>


      <div class="stat-card products-card">

        <div class="stat-icon icon-orange">
          📦
        </div>

        <div class="stat-title">
          Produits
        </div>

        <div
          class="stat-value"
          id="productsCount"
        >
          0
        </div>

        <div class="stat-footer orange">
          ↗ +0 nouveau
        </div>

      </div>


      <div class="stat-card customers-card">

        <div class="
