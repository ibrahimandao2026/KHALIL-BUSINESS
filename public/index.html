<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHALIL BUSINESS 🇸🇳</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --blue-dark: #063567;
      --blue: #0879df;
      --green: #08a653;
      --purple: #7138dd;
      --orange: #f5a500;
      --text: #071f4d;
      --background: #eef9ff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 90px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .hero {
      position: relative;
      height: 500px;
      overflow: hidden;
      background: #063567;
      color: white;
    }

    /* grande courbe blanche en bas */
    .hero::after {
      content: "";
      position: absolute;
      left: -10%;
      bottom: -95px;
      width: 120%;
      height: 175px;
      background: white;
      border-radius: 50% 50% 0 0;
      z-index: 2;
    }

    .hero-top {
      position: absolute;
      top: 32px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .menu-icon {
      width: 42px;
      height: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-icon span {
      height: 4px;
      width: 40px;
      background: white;
      border-radius: 5px;
    }

    .notification {
      position: relative;
      font-size: 35px;
      cursor: pointer;
      line-height: 1;
    }

    .notification-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 12px;
      height: 12px;
      background: #ef3340;
      border-radius: 50%;
    }

    /* contenu du header */

    .hero-content {
      position: absolute;
      top: 170px;
      left: 5%;
      width: 90%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    /* LOGO KB */

    .kb-logo {
      width: 135px;
      height: 135px;
      min-width: 135px;
      border: 5px solid #f5ca32;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f5ca32;
      background: rgba(0,0,0,0.04);
    }

    .crown {
      font-size: 32px;
      line-height: 30px;
    }

    .kb {
      font-size: 40px;
      font-weight: bold;
      line-height: 43px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 40px;
      line-height: 1.1;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-title .gold {
      color: #f6c934;
    }

    .senegal {
      font-size: 30px;
      margin-left: 7px;
    }

    .slogan {
      margin: 16px 0 0;
      font-size: 20px;
      line-height: 1.45;
      color: #e9f2ff;
    }

    /* PHOTO PNG */

    .profile-photo {
      width: 180px;
      height: 180px;
      min-width: 180px;
      border-radius: 50%;
      overflow: hidden;
      background: #ddd;
      border: 6px solid white;
      box-shadow: 0 0 0 5px #f5ca32;
      margin-left: 15px;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =====================================================
       CONTENU
    ===================================================== */

    .container {
      position: relative;
      z-index: 5;
      width: 94%;
      max-width: 1100px;
      margin: -5px auto 0;
    }

    /* =====================================================
       STATISTIQUES
    ===================================================== */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .stat-card {
      position: relative;
      min-height: 180px;
      border-radius: 28px;
      padding: 25px;
      overflow: hidden;
      box-shadow: 0 7px 20px rgba(0, 70, 130, 0.08);
    }

    .card-sales {
      background: linear-gradient(
        145deg,
        #effff7,
        #e5fff5
      );
    }

    .card-profit {
      background: linear-gradient(
        145deg,
        #f0f8ff,
        #e9f5ff
      );
    }

    .card-products {
      background: linear-gradient(
        145deg,
        #fffaf0,
        #fff3d7
      );
    }

    .card-customers {
      background: linear-gradient(
        145deg,
        #fbf6ff,
        #f5edff
      );
    }

    .stat-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 37px;
    }

    .green-icon {
      background: #08b952;
    }

    .blue-icon {
      background: #278be8;
    }

    .orange-icon {
      background: #f4a400;
    }

    .purple-icon {
      background: #7438dc;
    }

    .stat-content {
      position: absolute;
      left: 115px;
      top: 25px;
      right: 12px;
    }

    .stat-title {
      font-size: 23px;
      line-height: 1.2;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      color: #061e4b;
    }

    .stat-footer {
      position: absolute;
      left: 115px;
      bottom: 25px;
      font-size: 17px;
    }

    .green-text {
      color: #079447;
    }

    .blue-text {
      color: #0879df;
    }

    .orange-text {
      color: #e69a00;
    }

    .purple-text {
      color: #7438dc;
    }

    /* =====================================================
       MENU PRINCIPAL
    ===================================================== */

    .main-menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 25px 0;
    }

    .main-button {
      border: none;
      min-height: 80px;
      border-radius: 19px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0,0,0,0.12);
      transition: transform .15s;
    }

    .main-button:active {
      transform: scale(.97);
    }

    .clients-button {
      background: linear-gradient(
        135deg,
        #0754aa,
        #0b6aca
      );
    }

    .sales-button {
      background: linear-gradient(
        135deg,
        #008b43,
        #09a85a
      );
    }

    .ai-button {
      background: linear-gradient(
        135deg,
        #602bc8,
        #743be4
      );
    }

    /* =====================================================
       SECTIONS
    ===================================================== */

    .section {
      display: none;
      background: white;
      border-radius: 28px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 7px 22px rgba(0,60,120,.08);
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    /* =====================================================
       ASSISTANT IA
    ===================================================== */

    .assistant-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .assistant-title-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .robot-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #0757b5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      color: white;
    }

    .assistant-title {
      margin: 0 !important;
      font-size: 29px !important;
    }

    .online {
      margin-top: 5px;
      color: #079447;
      font-size: 16px;
    }

    .business-side {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
    }

    .business-side small {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      font-weight: normal;
    }

    #messages {
      min-height: 180px;
      max-height: 450px;
      overflow-y: auto;
      background: #f7fbff;
      border-radius: 20px;
      padding: 10px;
      margin: 20px 0;
    }

    .message {
      max-width: 90%;
      padding: 15px 18px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.assistant {
      background: #e7f2ff;
      margin-right: auto;
    }

    .message.user {
      background: #d5eaff;
      margin-left: auto;
      text-align: right;
    }

    /* QUESTIONS RAPIDES */

    .quick-buttons {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 3px 2px 13px;
      scrollbar-width: none;
    }

    .quick-buttons::-webkit-scrollbar {
      display: none;
    }

    .quick-button {
      flex-shrink: 0;
      border: 2px solid #a8d4f7;
      background: white;
      color: #0872d4;
      border-radius: 25px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    /* CHAT */

    .chat-form {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 2px solid #b8dcf8;
      border-radius: 35px;
      padding: 6px 7px 6px 15px;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      resize: vertical;
      min-height: 50px;
      max-height: 130px;
      padding: 12px;
      font-size: 16px;
    }

    #sendButton {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #1585e9;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
    }

    /* =====================================================
       FORMULAIRES
    ===================================================== */

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0 12px;
      border: 1px solid #cdd9e5;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #1685e9;
    }

    .action-button {
      border: none;
      background: #0864c7;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: #f4f8fc;
    }

    /* =====================================================
       NAVIGATION BAS
    ===================================================== */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 82px;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #dbe5ef;
      box-shadow: 0 -5px 20px rgba(0,0,0,.08);
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .bottom-nav button {
      border: none;
      background: transparent;
      color: #4a5870;
      font-size: 13px;
      cursor: pointer;
    }

    .bottom-icon {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
    }

    .bottom-nav button.active {
      color: #0879df;
      font-weight: bold;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      body {
        padding-bottom: 82px;
      }

      /* HEADER MOBILE */

      .hero {
        height: 500px;
      }

      .hero-top {
        top: 25px;
        left: 30px;
        right: 30px;
      }

      .menu-icon {
        width: 40px;
        height: 34px;
      }

      .menu-icon span {
        width: 39px;
        height: 4px;
      }

      .notification {
        font-size: 31px;
      }

      .hero-content {
        top: 190px;
        left: 6%;
        width: 88%;
        align-items: center;
      }

      .brand-area {
        gap: 14px;
        align-items: center;
      }

      .kb-logo {
        width: 120px;
        min-width: 120px;
        height: 120px;
        border-width: 4px;
      }

      .crown {
        font-size: 27px;
      }

      .kb {
        font-size: 36px;
      }

      .brand-title {
        font-size: 27px;
      }

      .senegal {
        font-size: 23px;
      }

      .slogan {
        font-size: 15px;
        margin-top: 12px;
      }

      .profile-photo {
        position: absolute;
        left: 100%;
        transform: translateX(-15px);
        width: 145px;
        height: 145px;
        min-width: 145px;
        border-width: 5px;
      }

      .container {
        width: 94%;
        margin-top: -2px;
      }

      /* STATISTIQUES */

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .stat-card {
        min-height: 190px;
        border-radius: 27px;
        padding: 20px;
      }

      .stat-icon {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }

      .stat-content {
        left: 92px;
        top: 25px;
      }

      .stat-title {
        font-size: 20px;
      }

      .stat-value {
        font-size: 31px;
      }

      .stat-footer {
        left: 92px;
        bottom: 23px;
        font-size: 14px;
      }

      /* BOUTONS */

      .main-menu {
        gap: 10px;
        margin: 18px 0;
      }

      .main-button {
        min-height: 65px;
        border-radius: 17px;
        font-size: 14px;
      }

      /* ASSISTANT */

      .section {
        padding: 18px;
        border-radius: 23px;
      }

      .assistant-header {
        align-items: flex-start;
      }

      .robot-icon {
        width: 58px;
        height: 58px;
        font-size: 30px;
      }

      .assistant-title {
        font-size: 25px !important;
      }

      .business-side {
        display: none;
      }

      .message {
        max-width: 95%;
        font-size: 15px;
      }

      .quick-button {
        font-size: 13px;
      }
    }

    /* =====================================================
       PETITS TÉLÉPHONES
    ===================================================== */

    @media (max-width: 430px) {

      .hero {
        height: 455px;
      }

      .hero-content {
        top: 175px;
      }

      .kb-logo {
        width: 94px;
        min-width: 94px;
        height: 94px;
      }

      .crown {
        font-size: 22px;
      }

      .kb {
        font-size: 29px;
      }

      .brand-title {
        font-size: 21px;
      }

      .senegal {
        font-size: 18px;
      }

      .slogan {
        font-size: 12px;
      }

      .profile-photo {
        width: 120px;
        height: 120px;
        min-width: 120px;
      }

      .stat-card {
        min-height: 165px;
        padding: 15px;
      }

      .stat-icon {
        width: 58px;
        height: 58px;
        font-size: 28px;
      }

      .stat-content {
        left: 78px;
        top: 20px;
      }

      .stat-title {
        font-size: 16px;
      }

      .stat-value {
        font-size: 25px;
      }

      .stat-footer {
        left: 78px;
        bottom: 18px;
        font-size: 11px;
      }

      .main-button {
        min-height: 58px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="hero">

    <div class="hero-top">

      <div class="menu-icon" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="notification">
        ♧
        <span class="notification-dot"></span>
      </div>

    </div>


    <div class="hero-content">

      <div class="brand-area">

        <div class="kb-logo">
          <div class="crown">♛</div>
          <div class="kb">KB</div>
        </div>

        <div class="brand-text">

          <h1 class="brand-title">
            <span class="gold">KHALIL</span>
            BUSINESS
            <span class="senegal">🇸🇳</span>
          </h1>

          <p class="slogan">
            Votre assistant intelligent pour gérer<br>
            votre activité
          </p>

        </div>

      </div>


      <!--
        PHOTO PNG
        Mets ton fichier dans :
        public/photo.png
      -->

      <div class="profile-photo">

        <img
          src="/photo.png"
          alt="Photo"
        >

      </div>

    </div>

  </header>


  <!-- =====================================================
       CONTENU PRINCIPAL
  ====================================================== -->

  <main class="container">


    <!-- ===================================================
         STATISTIQUES
    ==================================================== -->

    <div class="stats">


      <!-- CHIFFRE D'AFFAIRES -->

      <div class="stat-card card-sales">

        <div class="stat-icon green-icon">
          💰
        </div>

        <div class="stat-content">

          <div class="stat-title">
            Chiffre<br class="mobile-break">
            d'affaires
          </div>

          <div
            class="stat-value"
            id="totalSales"
          >
            0 FCFA
          </div>

        </div>

        <div class="stat-footer green-text">
          ↗ +0% ce mois
        </div>

      </div>


      <!-- BENEFICE -->

      <div class="stat-card card-profit">

        <div class="stat-icon blue-icon">
          📊
        </div>

        <div class="stat-content">

          <div class="stat-title">
            Bénéfice
          </div>

          <div
            class="stat-value"
            id="profit"
          >
            0 FCFA
          </div>

        </div>

        <div class="stat-footer blue-text">
          ↗ +0% ce mois
        </div>

      </div>


      <!-- PRODUITS -->

      <div class="stat-card card-products">

        <div class="stat-icon orange-icon">
          📦
        </div>

        <div class="stat-content">

          <div class="stat-title">
            Produits
          </div>

          <div
            class="stat-value"
            id="productsCount"
          >
            0
          </div>

        </div>

        <div class="stat-footer orange-text">
          ↗ +0 nouveau
        </div>

      </div>


      <!-- CLIENTS -->

      <div class="stat-card card-customers">

        <div class="stat-icon purple-icon">
          👥
        </div>

        <div class="stat-content">

          <div class="stat-title">
            Clients
          </div>

          <div
            class="stat-value"
            id="customersCount"
          >
            0
          </div>

        </div>

        <div class="stat-footer purple-text">
          ↗ +0 nouveau
        </div>

      </div>

    </div>


    <!-- ===================================================
         3 BOUTONS
    ==================================================== -->

    <div class="main-menu">

      <button
        class="main-button clients-button"
        onclick="showSection('clients')"
      >
        👥 &nbsp; Clients
      </button>

      <button
        class="main-button sales-button"
        onclick="showSection('sales')"
      >
        💰 &nbsp; Ventes
      </button>

      <button
        class="main-button ai-button"
        onclick="showSection('assistant')"
      >
        🤖 &nbsp; Assistant IA
      </button>

    </div>
