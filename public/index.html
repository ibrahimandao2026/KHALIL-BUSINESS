<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHALIL BUSINESS 🇸🇳</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          rgba(238, 242, 247, 0.92),
          rgba(238, 242, 247, 0.96)
        );
      color: #111827;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background:
        linear-gradient(
          135deg,
          #071a41,
          #0d3b78,
          #1266a8
        );

      color: white;
      padding: 25px 18px 30px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .profile-photo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      margin-bottom: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      color: #e5efff;
      font-size: 16px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      background: rgba(255,255,255,0.12);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 14px;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* =========================
       CONTENEUR
    ========================= */

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 20px auto 110px;
    }

    /* =========================
       STATISTIQUES
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
    }

    .stat-title {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
      color: #111827;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .menu button {
      border: none;
      background: white;
      color: #0d3b78;
      border-radius: 16px;
      padding: 15px 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .menu button:hover {
      transform: translateY(-2px);
      background: #eaf3ff;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      display: none;
      background: white;
      border-radius: 25px;
      padding: 22px;
      margin-top: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-top: 0;
      color: #0d3b78;
      font-size: 24px;
    }

    /* =========================
       ASSISTANT
    ========================= */

    .assistant-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .assistant-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #0d3b78;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      flex-shrink: 0;
    }

    .assistant-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .assistant-title p {
      margin: 5px 0 0;
      color: #16a34a;
      font-weight: bold;
    }

    .chat-box {
      background: #f3f8fd;
      border-radius: 22px;
      padding: 12px;
      border: 1px solid #dceafa;
    }

    #messages {
      height: 390px;
      overflow-y: auto;
      padding: 12px;
      background: white;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .message {
      padding: 13px 16px;
      border-radius: 17px;
      margin: 10px 0;
      max-width: 88%;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 15px;
    }

    .message.user {
      background: #dbeafe;
      color: #12335f;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #eef2f7;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .chat-form {
      display: flex;
      gap: 9px;
      background: white;
      padding: 7px;
      border-radius: 18px;
      border: 2px solid #b9d8f5;
    }

    #messageInput {
      flex: 1;
      min-height: 52px;
      max-height: 130px;
      resize: vertical;
      border: none;
      outline: none;
      padding: 13px;
      font-size: 16px;
      background: transparent;
    }

    #sendButton {
      width: 105px;
      border: none;
      border-radius: 15px;
      background: #0d78d4;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #075ca7;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 10px 0;
      padding-bottom: 3px;
    }

    .quick-actions button {
      white-space: nowrap;
      border: 1px solid #a8d0f2;
      background: white;
      color: #1266a8;
      border-radius: 20px;
      padding: 9px 14px;
      cursor: pointer;
    }

    /* =========================
       FORMULAIRES
    ========================= */

    input,
    select {
      width: 100%;
      padding: 14px;
      margin: 6px 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #1683dc;
      box-shadow: 0 0 0 3px rgba(22,131,220,0.1);
    }

    .action-button {
      border: none;
      background: #0d3b78;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .action-button:hover {
      background: #082a57;
    }

    .result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
    }

    /* =========================
       PRODUITS
    ========================= */

    .product-form {
      background: #f8fafc;
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      color: #6b7280;
      padding: 20px;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      header {
        padding: 22px 15px 25px;
      }

      .profile-photo {
        width: 90px;
        height: 90px;
      }

      header h1 {
        font-size: 25px;
      }

      header p {
        font-size: 15px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-title {
        font-size: 14px;
      }

      .stat-value {
        font-size: 23px;
      }

      .menu {
        grid-template-columns: repeat(2, 1fr);
      }

      .section {
        padding: 17px;
      }

      #messages {
        height: 350px;
      }

      .chat-form {
        align-items: stretch;
      }

      #sendButton {
        width: 80px;
      }
    }

    @media (max-width: 450px) {

      .container {
        width: 95%;
      }

      .stats {
        gap: 10px;
      }

      .stat-card {
        border-radius: 17px;
        padding: 14px;
      }

      .stat-value {
        font-size: 21px;
      }

      .menu button {
        font-size: 14px;
      }
